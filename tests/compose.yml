services:
  tizbac:
    user: 1000:1000
    image: ghcr.io/osshield/gopbs-tests-tizbac:latest
    build:
      context: .
      dockerfile: tizbac.Dockerfile
    volumes:
      - ./.test-source:/source:ro
      - ./.test-pxar:/pxar:rw

  pbs:
    user: 1000:1000
    image: ghcr.io/osshield/gopbs-tests-pbs:latest
    build:
      context: .
      dockerfile: pbs.Dockerfile
    command:
      - "create"
      - "/pxar/pbs.pxar"
      - "/source"
    volumes:
      - ./.test-source:/source:ro
      - ./.test-pxar:/pxar:rw

  gopbs:
    user: 1000:1000
    build:
      context: ..
      dockerfile: tests/gopbs.Dockerfile
    command:
      - -catalog
      - /pxar/gopbs.pcat1
      - /pxar/gopbs.pxar
      - /source
    volumes:
      - ./.test-source:/source:ro
      - ./.test-pxar:/pxar:rw

  # v2 split archives of the same source: official pxar and gopbs. The
  # outputs are byte-compared by TestSplitComparison, so any framing
  # divergence from upstream fails loudly.
  pbssplit:
    user: 1000:1000
    image: ghcr.io/osshield/gopbs-tests-pbs:latest
    build:
      context: .
      dockerfile: pbs.Dockerfile
    command:
      - "create"
      - "/pxar/pbs.mpxar"
      - "/source"
      - "--payload-output"
      - "/pxar/pbs.ppxar"
    volumes:
      - ./.test-source:/source:ro
      - ./.test-pxar:/pxar:rw

  gopbssplit:
    user: 1000:1000
    build:
      context: ..
      dockerfile: tests/gopbs.Dockerfile
    command:
      - -payload
      - /pxar/gopbs.ppxar
      - /pxar/gopbs.mpxar
      - /source
    volumes:
      - ./.test-source:/source:ro
      - ./.test-pxar:/pxar:rw

  # Exclusion fixture (.test-source-exclude, built by exclude_test.go): the
  # same patterns given to the official CLI and to gopbs, which also honours
  # the fixture's .pxarexclude files like the CLI always does. Outputs are
  # byte-compared (v1 and split) and restored for a tree comparison.
  pbsexclude:
    user: 1000:1000
    image: ghcr.io/osshield/gopbs-tests-pbs:latest
    build:
      context: .
      dockerfile: pbs.Dockerfile
    command:
      - "create"
      - "/pxar/pbs-excl.pxar"
      - "/source"
      - "--exclude=*.tmp"
      - "--exclude=!keep.tmp"
      - "--exclude=cache/"
      - "--exclude=/anchored"
      - "--exclude=**/deep/*"
      - "--exclude=fol*_name/"
    volumes:
      - ./.test-source-exclude:/source:ro
      - ./.test-pxar:/pxar:rw

  gopbsexclude:
    user: 1000:1000
    build:
      context: ..
      dockerfile: tests/gopbs.Dockerfile
    command:
      - -catalog
      - /pxar/gopbs-excl.pcat1
      - -exclude=*.tmp
      - -exclude=!keep.tmp
      - -exclude=cache/
      - -exclude=/anchored
      - -exclude=**/deep/*
      - -exclude=fol*_name/
      - -pxarexclude
      - /pxar/gopbs-excl.pxar
      - /source
    volumes:
      - ./.test-source-exclude:/source:ro
      - ./.test-pxar:/pxar:rw

  pbssplitexclude:
    user: 1000:1000
    image: ghcr.io/osshield/gopbs-tests-pbs:latest
    build:
      context: .
      dockerfile: pbs.Dockerfile
    command:
      - "create"
      - "/pxar/pbs-excl.mpxar"
      - "/source"
      - "--payload-output"
      - "/pxar/pbs-excl.ppxar"
      - "--exclude=*.tmp"
      - "--exclude=!keep.tmp"
      - "--exclude=cache/"
      - "--exclude=/anchored"
      - "--exclude=**/deep/*"
      - "--exclude=fol*_name/"
    volumes:
      - ./.test-source-exclude:/source:ro
      - ./.test-pxar:/pxar:rw

  gopbssplitexclude:
    user: 1000:1000
    build:
      context: ..
      dockerfile: tests/gopbs.Dockerfile
    command:
      - -payload
      - /pxar/gopbs-excl.ppxar
      - -exclude=*.tmp
      - -exclude=!keep.tmp
      - -exclude=cache/
      - -exclude=/anchored
      - -exclude=**/deep/*
      - -exclude=fol*_name/
      - -pxarexclude
      - /pxar/gopbs-excl.mpxar
      - /source
    volumes:
      - ./.test-source-exclude:/source:ro
      - ./.test-pxar:/pxar:rw

  restore:
    user: 0:0
    image: ghcr.io/osshield/gopbs-tests-pbs:latest
    entrypoint: ""
    command:
      - "bash"
      - "-ec"
      - |
        rm -rf /restore/pbs /restore/tizbac /restore/gopbs /restore/gopbs-split
        rm -rf /restore/pbs-excl /restore/gopbs-excl /restore/gopbs-excl-split
        pxar extract /pxar/pbs.pxar /restore/pbs
        pxar extract /pxar/tizbac.pxar /restore/tizbac
        pxar extract /pxar/gopbs.pxar /restore/gopbs
        pxar extract --payload-input /pxar/gopbs.ppxar /pxar/gopbs.mpxar /restore/gopbs-split
        pxar extract /pxar/pbs-excl.pxar /restore/pbs-excl
        pxar extract /pxar/gopbs-excl.pxar /restore/gopbs-excl
        pxar extract --payload-input /pxar/gopbs-excl.ppxar /pxar/gopbs-excl.mpxar /restore/gopbs-excl-split
        chmod -R 777 /restore/*
    volumes:
      - ./.test-pxar:/pxar:ro
      - ./.test-restore:/restore:rw

  # One-off backup of /source/$$SUBDIR to the pmoxs3 stack with the official
  # proxmox-backup-client (used by the performance comparison). MODE selects
  # the archive format: legacy = v1 pxar, metadata = v2 split mpxar/ppxar.
  pbsbackup:
    user: 1000:1000
    image: ghcr.io/osshield/gopbs-tests-pbs:latest
    build:
      context: .
      dockerfile: pbs.Dockerfile
    entrypoint: ""
    environment:
      HOME: /tmp
      PBS_PASSWORD: garagegaragegarage
      PBS_FINGERPRINT: "55:BC:29:4B:BA:B6:A1:03:42:A9:D8:51:14:9D:BD:00:D2:2A:9C:A1:B8:4A:85:E1:AF:B2:0C:48:40:D6:CC:A4"
    command:
      - bash
      - -ec
      - |
        cd "/source/$$SUBDIR"
        proxmox-backup-client backup "root.pxar:." \
          --repository garagegarage@pbs@pmoxs3:pbs \
          --backup-id "$$BACKUPID" --change-detection-mode "$$MODE"
    volumes:
      - ./.test-source:/source:ro

  # One-off restore of a snapshot from the pmoxs3 stack with the official
  # proxmox-backup-client; SNAPSHOT/ARCHIVE/TARGET come from `compose run -e`.
  # KEYFILE (optional, e.g. /keys/pbs-key.json) decrypts an encrypted
  # snapshot; the key files are written by the tests into ./.test-keys.
  # RAW=1 restores a non-pxar index, which the client writes raw only to stdout.
  # Runs as root: restoring ownership (e.g. the uid/gid-0 virtual root and
  # stream entries) needs it; the chmod afterwards lets the host user clean up.
  pbsrestore:
    user: 0:0
    build:
      context: .
      dockerfile: pbs.Dockerfile
    entrypoint: ""
    environment:
      HOME: /tmp
      PBS_PASSWORD: garagegaragegarage
      PBS_FINGERPRINT: "55:BC:29:4B:BA:B6:A1:03:42:A9:D8:51:14:9D:BD:00:D2:2A:9C:A1:B8:4A:85:E1:AF:B2:0C:48:40:D6:CC:A4"
    command:
      - bash
      - -ec
      - |
        if [ -n "$${RAW:-}" ]; then
          proxmox-backup-client restore "$$SNAPSHOT" "$$ARCHIVE" - --repository garagegarage@pbs@pmoxs3:pbs $${KEYFILE:+--keyfile "$$KEYFILE"} > "$$TARGET"
        else
          proxmox-backup-client restore "$$SNAPSHOT" "$$ARCHIVE" "$$TARGET" --repository garagegarage@pbs@pmoxs3:pbs $${KEYFILE:+--keyfile "$$KEYFILE"}
        fi
        chmod -R a+rwX "$$TARGET"
    volumes:
      - ./.test-restore:/restore:rw
      - ./.test-keys:/keys:ro

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    environment:
      GARAGE_DEFAULT_BUCKET: pbs
      GARAGE_DEFAULT_ACCESS_KEY: garagegarage
      GARAGE_DEFAULT_SECRET_KEY: garagegaragegarage
      GARAGE_DEFAULT_REGION: local
    command:
      - /garage
      - server
      - --single-node
      - --default-bucket

  # Connection settings:
  # Host: localhost:8007
  # User ID: garagegarage@pbs
  # Secret Key: garagegaragegarage
  # Repository: pbs
  # Fingerprint: 55:BC:29:4B:BA:B6:A1:03:42:A9:D8:51:14:9D:BD:00:D2:2A:9C:A1:B8:4A:85:E1:AF:B2:0C:48:40:D6:CC:A4
  pmoxs3:
    image: ghcr.io/tizbac/pmoxs3backuproxy:latest
    command: -bind 0.0.0.0:8007 -endpoint garage:3900
    container_name: pmoxs3
    hostname: pmoxs3
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '8007:8007'